AWSTemplateFormatVersion: '2010-09-09'
Description: Slack AI Assistant - ECS Fargate Deployment

Parameters:
  AppName:
    Type: String
    Default: slack-ai-assistant

  Environment:
    Type: String
    Default: production
    AllowedValues:
      - production
      - staging

  ECRImageUri:
    Type: String
    Description: ECR Image URI (e.g., 123456789.dkr.ecr.us-west-2.amazonaws.com/slack-ai-assistant:latest)

Resources:
  # VPC
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-vpc

  # Public Subnets
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-public-2

  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Route Table
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # Security Group
  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ECS tasks
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-ecs-sg

  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${AppName}-cluster
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AppName}
      RetentionInDays: 30

  # IAM Role for ECS Task Execution
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppName}/*

  # S3 Bucket for incremental sync state
  SyncStateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AppName}-sync-state-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled

  # IAM Role for ECS Task
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'
        - PolicyName: S3SyncStateAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub arn:aws:s3:::${AppName}-sync-state-${AWS::AccountId}/sync_state.json
                  - !Sub arn:aws:s3:::${AppName}-sync-state-${AWS::AccountId}/eval_logs/*

  # ECS Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AppName}-task
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '512'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: !Ref AppName
          Image: !Ref ECRImageUri
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: PINECONE_ENVIRONMENT
              Value: us-east-1
            - Name: PINECONE_INDEX_NAME
              Value: slack-ai-assistant
            - Name: SLACK_AUTO_REPLY_CHANNELS
              Value: CME3BV4PN,C061Q3XQMPA,C02LQGXAY69
            - Name: SLACK_KNOWLEDGE_CHANNELS
              Value: C0551545GU8,CH4B7A2FJ
            - Name: SLACK_NO_WEB_SEARCH_CHANNELS
              Value: C02LQGXAY69
            - Name: GOOGLE_DRIVE_FOLDER_ID
              Value: 0AC0oLVMcTPpcUk9PVA
            - Name: S3_STATE_BUCKET
              Value: !Sub ${AppName}-sync-state-${AWS::AccountId}
          Secrets:
            - Name: PINECONE_API_KEY
              ValueFrom: arn:aws:secretsmanager:us-west-2:433864970174:secret:slack-ai-assistant/pinecone-api-key-rW3Hb8
            - Name: SLACK_BOT_TOKEN
              ValueFrom: arn:aws:secretsmanager:us-west-2:433864970174:secret:slack-ai-assistant/slack-bot-token-gCxuUB
            - Name: SLACK_APP_TOKEN
              ValueFrom: arn:aws:secretsmanager:us-west-2:433864970174:secret:slack-ai-assistant/slack-app-token-Wj7pCw
            - Name: SLACK_SIGNING_SECRET
              ValueFrom: arn:aws:secretsmanager:us-west-2:433864970174:secret:slack-ai-assistant/slack-signing-secret-7uMAGe
            - Name: COHERE_API_KEY
              ValueFrom: arn:aws:secretsmanager:us-west-2:433864970174:secret:slack-ai-assistant/cohere-api-key-3rdnS6

  # ECS Service
  ECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub ${AppName}-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ECSSecurityGroup
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2

  # Scheduled Task: Weekly Pinecone data sync (Sunday 6AM JST = Saturday 21:00 UTC)
  ScheduledTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-scheduled-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunECSTask
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecs:RunTask
                Resource:
                  - !Ref TaskDefinition
                  - !Ref EvaluationTaskDefinition
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt ECSTaskExecutionRole.Arn
                  - !GetAtt ECSTaskRole.Arn

  WeeklySyncRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AppName}-weekly-sync
      Description: Weekly Pinecone data sync (Sunday 6AM JST)
      ScheduleExpression: cron(0 21 ? * SAT *)
      State: ENABLED
      Targets:
        - Id: !Sub ${AppName}-sync-task
          Arn: !GetAtt ECSCluster.Arn
          RoleArn: !GetAtt ScheduledTaskRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref TaskDefinition
            TaskCount: 1
            LaunchType: FARGATE
            NetworkConfiguration:
              AwsVpcConfiguration:
                AssignPublicIp: ENABLED
                SecurityGroups:
                  - !Ref ECSSecurityGroup
                Subnets:
                  - !Ref PublicSubnet1
                  - !Ref PublicSubnet2
          Input: !Sub |
            {
              "containerOverrides": [
                {
                  "name": "${AppName}",
                  "command": ["python", "scripts/sync_pinecone_data.py"]
                }
              ]
            }

  # Evaluation Task Definition (higher memory for RAGAS)
  EvaluationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AppName}-evaluation-task
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '512'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: !Ref AppName
          Image: !Ref ECRImageUri
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: evaluation
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: PINECONE_ENVIRONMENT
              Value: us-east-1
            - Name: PINECONE_INDEX_NAME
              Value: slack-ai-assistant
            - Name: SLACK_AUTO_REPLY_CHANNELS
              Value: CME3BV4PN,C061Q3XQMPA,C02LQGXAY69
            - Name: GOOGLE_DRIVE_FOLDER_ID
              Value: 0AC0oLVMcTPpcUk9PVA
          Secrets:
            - Name: PINECONE_API_KEY
              ValueFrom: arn:aws:secretsmanager:us-west-2:433864970174:secret:slack-ai-assistant/pinecone-api-key-rW3Hb8
            - Name: SLACK_BOT_TOKEN
              ValueFrom: arn:aws:secretsmanager:us-west-2:433864970174:secret:slack-ai-assistant/slack-bot-token-gCxuUB
            - Name: SLACK_APP_TOKEN
              ValueFrom: arn:aws:secretsmanager:us-west-2:433864970174:secret:slack-ai-assistant/slack-app-token-Wj7pCw
            - Name: SLACK_SIGNING_SECRET
              ValueFrom: arn:aws:secretsmanager:us-west-2:433864970174:secret:slack-ai-assistant/slack-signing-secret-7uMAGe
            - Name: COHERE_API_KEY
              ValueFrom: arn:aws:secretsmanager:us-west-2:433864970174:secret:slack-ai-assistant/cohere-api-key-3rdnS6

  # Scheduled Task: Weekly RAGAS Evaluation (Monday 2AM JST = Sunday 17:00 UTC)
  WeeklyEvaluationRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AppName}-weekly-evaluation
      Description: Weekly RAG evaluation with RAGAS (Monday 2AM JST)
      ScheduleExpression: cron(0 17 ? * SUN *)
      State: ENABLED
      Targets:
        - Id: !Sub ${AppName}-evaluation-task
          Arn: !GetAtt ECSCluster.Arn
          RoleArn: !GetAtt ScheduledTaskRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref EvaluationTaskDefinition
            TaskCount: 1
            LaunchType: FARGATE
            NetworkConfiguration:
              AwsVpcConfiguration:
                AssignPublicIp: ENABLED
                SecurityGroups:
                  - !Ref ECSSecurityGroup
                Subnets:
                  - !Ref PublicSubnet1
                  - !Ref PublicSubnet2
          Input: !Sub |
            {
              "containerOverrides": [
                {
                  "name": "${AppName}",
                  "command": ["python", "scripts/evaluate_rag.py"]
                }
              ]
            }

Outputs:
  ClusterName:
    Value: !Ref ECSCluster
    Description: ECS Cluster Name

  ServiceName:
    Value: !GetAtt ECSService.Name
    Description: ECS Service Name

  LogGroupName:
    Value: !Ref LogGroup
    Description: CloudWatch Log Group Name
